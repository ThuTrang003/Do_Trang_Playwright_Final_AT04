[pytest]
addopts = -v --alluredir=allure-results
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    ui: UI test (Playwright browser)
    api: API test (Playwright APIRequestContext)
    combined: Test kết hợp cả UI và API
    profile: Nhóm chức năng Change my profile
    settings: Nhóm chức năng Setting account
    smoke: Test smoke / must-pass
    password_change: Test làm thay đổi mật khẩu THẬT trên server dùng chung -
        KHÔNG được chạy song song với các test khác cùng nhóm này (race condition
        tài khoản dùng chung). Chỉ chạy tuần tự (không kèm -n).

log_cli = true
log_cli_level = INFO
